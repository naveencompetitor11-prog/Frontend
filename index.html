<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="dashboard">
  <h1>🌤 Weather Dashboard</h1>

  <input type="checkbox" id="toggle">
  <label for="toggle" class="btn">View Details</label>

  <div class="card">
    <div class="main">
      <h2>Chennai</h2>
      <p class="temp">32°C</p>
      <p>Sunny</p>
    </div>

    <div class="details">
      <p>💧 Humidity: 65%</p>
      <p>🌬 Wind: 12 km/h</p>
      <p>🌡 Feels Like: 34°C</p>
    </div>
  </div>
</div>

</body>
</html>
